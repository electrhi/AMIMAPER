name: Backfill Excel priority v2

on:
  push:
    branches:
      - priority-excel
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Set priority 1 for root Excel files
        run: |
          node <<'NODE'
          const XLSX = require('xlsx');

          const APP_URL = 'https://amimaper.onrender.com';
          const PROJECT_URL = 'https://ijuxerhjqmrpjwgsfuqk.supabase.co';
          const BUCKET = 'excels';
          const BACKUP_PREFIX = '_priority_backup_20260913';
          const MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

          const decodePayload = (token) => {
            try {
              return JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            } catch (_) {
              return null;
            }
          };

          async function getPublishedAnonKey() {
            const htmlRes = await fetch(APP_URL, { redirect: 'follow' });
            if (!htmlRes.ok) throw new Error(`앱 HTML 조회 실패: ${htmlRes.status}`);
            const html = await htmlRes.text();
            const scripts = [...html.matchAll(/<script[^>]+src=["']([^"']+\.js)["']/g)];
            if (!scripts.length) throw new Error('배포 번들 경로를 찾지 못했습니다.');

            for (const match of scripts) {
              const jsRes = await fetch(new URL(match[1], APP_URL));
              if (!jsRes.ok) continue;
              const text = await jsRes.text();
              const tokens = text.match(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g) || [];
              for (const token of tokens) {
                const payload = decodePayload(token);
                if (payload?.ref === 'ijuxerhjqmrpjwgsfuqk' && payload?.role === 'anon') return token;
              }
            }
            throw new Error('배포 앱에서 공개 anon key를 찾지 못했습니다.');
          }

          const encodePath = (path) => path.split('/').map(encodeURIComponent).join('/');

          const authHeaders = (key, extra = {}) => ({
            apikey: key,
            Authorization: `Bearer ${key}`,
            ...extra,
          });

          async function listRoot(key) {
            const res = await fetch(`${PROJECT_URL}/storage/v1/object/list/${BUCKET}`, {
              method: 'POST',
              headers: authHeaders(key, { 'Content-Type': 'application/json' }),
              body: JSON.stringify({ prefix: '', limit: 1000, offset: 0, sortBy: { column: 'name', order: 'asc' } }),
            });
            if (!res.ok) throw new Error(`파일 목록 조회 실패: ${res.status} ${await res.text()}`);
            return await res.json();
          }

          async function downloadObject(key, path) {
            const res = await fetch(`${PROJECT_URL}/storage/v1/object/${BUCKET}/${encodePath(path)}`, {
              headers: authHeaders(key),
            });
            if (!res.ok) throw new Error(`${path} 다운로드 실패: ${res.status} ${await res.text()}`);
            return Buffer.from(await res.arrayBuffer());
          }

          async function uploadObject(key, path, bytes) {
            const res = await fetch(`${PROJECT_URL}/storage/v1/object/${BUCKET}/${encodePath(path)}`, {
              method: 'POST',
              headers: authHeaders(key, {
                'Content-Type': MIME,
                'x-upsert': 'true',
                'cache-control': '0',
              }),
              body: bytes,
            });
            if (!res.ok) throw new Error(`${path} 업로드 실패: ${res.status} ${await res.text()}`);
          }

          function setAllPriorityOne(bytes) {
            const workbook = XLSX.read(bytes, { type: 'array', cellStyles: true, cellDates: true });
            const sheetName = workbook.SheetNames?.[0];
            if (!sheetName) throw new Error('첫 번째 시트가 없습니다.');
            const sheet = workbook.Sheets[sheetName];
            if (!sheet?.['!ref']) throw new Error('시트 데이터 범위가 없습니다.');

            const range = XLSX.utils.decode_range(sheet['!ref']);
            let priorityCol = -1;
            for (let c = range.s.c; c <= range.e.c; c += 1) {
              const cell = sheet[XLSX.utils.encode_cell({ r: range.s.r, c })];
              if (String(cell?.v ?? '').trim() === '우선순위') {
                priorityCol = c;
                break;
              }
            }
            if (priorityCol < 0) {
              priorityCol = range.e.c + 1;
              range.e.c = priorityCol;
            }

            const headerAddress = XLSX.utils.encode_cell({ r: range.s.r, c: priorityCol });
            sheet[headerAddress] = { ...(sheet[headerAddress] || {}), t: 's', v: '우선순위' };

            let rowCount = 0;
            for (let r = range.s.r + 1; r <= range.e.r; r += 1) {
              const address = XLSX.utils.encode_cell({ r, c: priorityCol });
              sheet[address] = { ...(sheet[address] || {}), t: 'n', v: 1 };
              rowCount += 1;
            }
            sheet['!ref'] = XLSX.utils.encode_range(range);

            return {
              output: XLSX.write(workbook, { type: 'buffer', bookType: 'xlsx', cellStyles: true, compression: true }),
              rowCount,
            };
          }

          function verifyPriority(bytes) {
            const workbook = XLSX.read(bytes, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames?.[0]];
            if (!sheet?.['!ref']) return { ok: false, reason: 'no-range' };
            const range = XLSX.utils.decode_range(sheet['!ref']);
            let priorityCol = -1;
            for (let c = range.s.c; c <= range.e.c; c += 1) {
              const cell = sheet[XLSX.utils.encode_cell({ r: range.s.r, c })];
              if (String(cell?.v ?? '').trim() === '우선순위') {
                priorityCol = c;
                break;
              }
            }
            if (priorityCol < 0) return { ok: false, reason: 'missing-column' };
            for (let r = range.s.r + 1; r <= range.e.r; r += 1) {
              const value = Number(sheet[XLSX.utils.encode_cell({ r, c: priorityCol })]?.v);
              if (value !== 1) return { ok: false, reason: `row-${r + 1}:${value}` };
            }
            return { ok: true, rows: Math.max(0, range.e.r - range.s.r) };
          }

          async function main() {
            const key = await getPublishedAnonKey();
            const items = await listRoot(key);
            const files = (items || [])
              .map((item) => String(item?.name ?? '').trim())
              .filter((name) => name && /\.xlsx$/i.test(name) && !name.includes('/'));

            console.log(`ROOT_XLSX_COUNT=${files.length}`);
            if (!files.length) throw new Error('수정할 루트 Excel 파일이 없습니다.');

            const changed = [];
            for (let i = 0; i < files.length; i += 1) {
              const fileName = files[i];
              console.log(`[${i + 1}/${files.length}] ${fileName}`);
              const source = await downloadObject(key, fileName);
              await uploadObject(key, `${BACKUP_PREFIX}/${fileName}`, source);
              const { output, rowCount } = setAllPriorityOne(source);
              await uploadObject(key, fileName, output);
              changed.push({ fileName, rowCount });
            }

            let verified = 0;
            for (const { fileName } of changed) {
              const bytes = await downloadObject(key, fileName);
              const result = verifyPriority(bytes);
              if (!result.ok) throw new Error(`${fileName} 검증 실패: ${result.reason}`);
              verified += 1;
            }

            console.log(`CHANGED_COUNT=${changed.length}`);
            console.log(`VERIFIED_COUNT=${verified}`);
            console.log(`BACKUP_PREFIX=${BACKUP_PREFIX}`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
