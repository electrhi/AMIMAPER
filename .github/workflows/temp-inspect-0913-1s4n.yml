name: Temporary AMIMAPER Verification

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Verify Supabase singleton wiring
        run: |
          test -f src/supabase-client.js
          test -f vite.supabase-singleton.js
          grep -q 'amimapSupabaseSingletonPlugin()' vite.config.performance.js
