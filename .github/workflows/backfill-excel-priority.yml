name: Backfill Excel priority

on:
  push:
    branches:
      - priority-excel
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Set priority 1 for root Excel files
        run: |
          node <<'NODE'
          const { createClient } = require('@supabase/supabase-js');
          const XLSX = require('xlsx');

          const APP_URL = 'https://amimaper.onrender.com';
          const PROJECT_URL = 'https://ijuxerhjqmrpjwgsfuqk.supabase.co';
          const BUCKET = 'excels';
          const BACKUP_PREFIX = '_priority_backup_20260913';
          const MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

          const decodePayload = (token) => {
            try {
              const part = token.split('.')[1];
              return JSON.parse(Buffer.from(part, 'base64url').toString('utf8'));
            } catch (_) {
              return null;
            }
          };

          async function getPublishedAnonKey() {
            const htmlRes = await fetch(APP_URL, { redirect: 'follow' });
            if (!htmlRes.ok) throw new Error(`앱 HTML 조회 실패: ${htmlRes.status}`);
            const html = await htmlRes.text();
            const scriptMatches = [...html.matchAll(/<script[^>]+src=["']([^"']+\.js)["']/g)];
            if (!scriptMatches.length) throw new Error('배포 번들 경로를 찾지 못했습니다.');

            for (const match of scriptMatches) {
              const url = new URL(match[1], APP_URL).toString();
              const jsRes = await fetch(url);
              if (!jsRes.ok) continue;
              const text = await jsRes.text();
              const tokens = text.match(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g) || [];
              for (const token of tokens) {
                const payload = decodePayload(token);
                if (payload?.ref === 'ijuxerhjqmrpjwgsfuqk' && payload?.role === 'anon') return token;
              }
            }
            throw new Error('배포 앱에서 공개 anon key를 찾지 못했습니다.');
          }

          function setAllPriorityOne(bytes) {
            const workbook = XLSX.read(bytes, { type: 'array', cellStyles: true, cellDates: true });
            const sheetName = workbook.SheetNames?.[0];
            if (!sheetName) throw new Error('첫 번째 시트가 없습니다.');
            const sheet = workbook.Sheets[sheetName];
            if (!sheet?.['!ref']) throw new Error('시트 데이터 범위가 없습니다.');

            const range = XLSX.utils.decode_range(sheet['!ref']);
            let priorityCol = -1;
            for (let c = range.s.c; c <= range.e.c; c += 1) {
              const cell = sheet[XLSX.utils.encode_cell({ r: range.s.r, c })];
              if (String(cell?.v ?? '').trim() === '우선순위') {
                priorityCol = c;
                break;
              }
            }

            if (priorityCol < 0) {
              priorityCol = range.e.c + 1;
              range.e.c = priorityCol;
            }

            const headerAddress = XLSX.utils.encode_cell({ r: range.s.r, c: priorityCol });
            const oldHeader = sheet[headerAddress];
            sheet[headerAddress] = { ...(oldHeader || {}), t: 's', v: '우선순위' };

            let rowCount = 0;
            for (let r = range.s.r + 1; r <= range.e.r; r += 1) {
              const address = XLSX.utils.encode_cell({ r, c: priorityCol });
              const oldCell = sheet[address];
              sheet[address] = { ...(oldCell || {}), t: 'n', v: 1 };
              rowCount += 1;
            }

            sheet['!ref'] = XLSX.utils.encode_range(range);
            const output = XLSX.write(workbook, {
              type: 'buffer',
              bookType: 'xlsx',
              cellStyles: true,
              compression: true,
            });
            return { output, rowCount };
          }

          function verifyPriority(bytes) {
            const workbook = XLSX.read(bytes, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames?.[0]];
            if (!sheet?.['!ref']) return { ok: false, reason: 'no-range' };
            const range = XLSX.utils.decode_range(sheet['!ref']);
            let priorityCol = -1;
            for (let c = range.s.c; c <= range.e.c; c += 1) {
              const cell = sheet[XLSX.utils.encode_cell({ r: range.s.r, c })];
              if (String(cell?.v ?? '').trim() === '우선순위') {
                priorityCol = c;
                break;
              }
            }
            if (priorityCol < 0) return { ok: false, reason: 'missing-column' };
            for (let r = range.s.r + 1; r <= range.e.r; r += 1) {
              const value = Number(sheet[XLSX.utils.encode_cell({ r, c: priorityCol })]?.v);
              if (value !== 1) return { ok: false, reason: `row-${r + 1}:${value}` };
            }
            return { ok: true, rows: Math.max(0, range.e.r - range.s.r) };
          }

          async function main() {
            const anonKey = await getPublishedAnonKey();
            const supabase = createClient(PROJECT_URL, anonKey, {
              auth: { persistSession: false, autoRefreshToken: false },
            });

            const { data: items, error: listError } = await supabase.storage.from(BUCKET).list('', {
              limit: 1000,
              offset: 0,
              sortBy: { column: 'name', order: 'asc' },
            });
            if (listError) throw listError;

            const files = (items || [])
              .map((item) => String(item?.name ?? '').trim())
              .filter((name) => name && /\.xlsx$/i.test(name) && !name.includes('/'));

            console.log(`ROOT_XLSX_COUNT=${files.length}`);
            if (!files.length) throw new Error('수정할 루트 Excel 파일이 없습니다.');

            const changed = [];
            for (let i = 0; i < files.length; i += 1) {
              const fileName = files[i];
              console.log(`[${i + 1}/${files.length}] ${fileName}`);

              const { data: blob, error: downloadError } = await supabase.storage.from(BUCKET).download(fileName);
              if (downloadError || !blob) throw new Error(`${fileName} 다운로드 실패: ${downloadError?.message || 'no data'}`);
              const source = Buffer.from(await blob.arrayBuffer());

              const { error: backupError } = await supabase.storage.from(BUCKET).upload(
                `${BACKUP_PREFIX}/${fileName}`,
                source,
                { upsert: true, contentType: MIME, cacheControl: '0' }
              );
              if (backupError) throw new Error(`${fileName} 백업 실패: ${backupError.message}`);

              const { output, rowCount } = setAllPriorityOne(source);
              const { error: uploadError } = await supabase.storage.from(BUCKET).upload(
                fileName,
                output,
                { upsert: true, contentType: MIME, cacheControl: '0' }
              );
              if (uploadError) throw new Error(`${fileName} 갱신 실패: ${uploadError.message}`);
              changed.push({ fileName, rowCount });
            }

            let verified = 0;
            for (const { fileName } of changed) {
              const { data: blob, error } = await supabase.storage.from(BUCKET).download(fileName);
              if (error || !blob) throw new Error(`${fileName} 검증 다운로드 실패: ${error?.message || 'no data'}`);
              const result = verifyPriority(Buffer.from(await blob.arrayBuffer()));
              if (!result.ok) throw new Error(`${fileName} 검증 실패: ${result.reason}`);
              verified += 1;
            }

            console.log(`CHANGED_COUNT=${changed.length}`);
            console.log(`VERIFIED_COUNT=${verified}`);
            console.log(`BACKUP_PREFIX=${BACKUP_PREFIX}`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
